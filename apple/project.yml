name: Kite
options:
  bundleIdPrefix: com.bkrdmrcioglu
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kite:
    type: application
    platform: macOS
    sources:
      - path: Kite
      - path: Shared
      - path: ../core/src
      - path: ../core/include
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bkrdmrcioglu.kite
        SWIFT_OBJC_BRIDGING_HEADER: Kite/Kite-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include $(SRCROOT)/../core/src
        GCC_PREPROCESSOR_DEFINITIONS: _DARWIN_C_SOURCE=1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_NAME: Kite DPI
        INFOPLIST_KEY_CFBundleDisplayName: Kite DPI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

  KiteiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KiteiOS
      - path: Shared
    dependencies:
      - target: KiteTunnel
    settings:
      base:
        PRODUCT_NAME: Kite DPI
        PRODUCT_BUNDLE_IDENTIFIER: com.bkrdmrcioglu.kite.ios
        DEVELOPMENT_TEAM: HLZQLSTBB8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KiteiOS/KiteiOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kite DPI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KiteTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KiteTunnel
      - path: Shared
      - path: ../core/src
      - path: ../core/include
        buildPhase: none
    info:
      path: KiteTunnel/Info.plist
      properties:
        CFBundleDisplayName: Kite DPI Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bkrdmrcioglu.kite.ios.tunnel
        DEVELOPMENT_TEAM: HLZQLSTBB8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: KiteTunnel/KiteTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: KiteTunnel/Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include $(SRCROOT)/../core/src
        TARGETED_DEVICE_FAMILY: "1"
